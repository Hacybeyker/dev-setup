name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Instalar las herramientas de validación
        run: |
          python -m venv .venv
          .venv/bin/pip install --quiet shellcheck-py==0.11.0.1
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Analizar los scripts de shell
        run: git ls-files -z '*.sh' 'bin/*' | xargs -0 --no-run-if-empty shellcheck
